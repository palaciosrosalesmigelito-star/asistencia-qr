<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Estudiante</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="mascot-bg" aria-hidden="true">
    <svg class="mascot-dancer" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g>
        <ellipse cx="100" cy="150" rx="55" ry="30" fill="#6b7280" />
        <circle cx="100" cy="90" r="42" fill="#9ca3af" />
        <polygon points="62,60 52,25 82,52" fill="#4b5563" />
        <polygon points="138,60 148,25 118,52" fill="#4b5563" />
        <ellipse cx="100" cy="95" rx="32" ry="20" fill="#1f2937" />
        <circle cx="86" cy="90" r="6" fill="#fff" />
        <circle cx="114" cy="90" r="6" fill="#fff" />
        <ellipse cx="100" cy="108" rx="7" ry="5" fill="#111827" />
        <rect x="45" y="135" width="110" height="40" rx="12" fill="#6b7280" />
        <rect x="60" y="145" width="80" height="20" rx="6" fill="#4b5563" />
      </g>
    </svg>
  </div>
  <div class="topbar">
    <h2>Panel Estudiante</h2>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <a href="#" class="active" data-view="escanear">Escanear QR</a>
      <a href="#" data-view="historial">Mi asistencia</a>
    </aside>
    <main class="content">
      <div id="view-escanear">
        <h1>Registrar asistencia</h1>
        <div class="tile">
          <div class="scanner-frame" id="scannerFrame">
            <div id="reader"></div>
            <span class="scanner-corner tl"></span>
            <span class="scanner-corner tr"></span>
            <span class="scanner-corner bl"></span>
            <span class="scanner-corner br"></span>
            <div class="scan-line"></div>
          </div>
          <p id="scanMsg" class="msg text-center mt-2"></p>
          <button id="startScanBtn" class="success large mt-2">Activar cámara y escanear</button>
        </div>
      </div>
      <div id="view-historial" class="hidden">
        <h1>Mi historial de asistencia</h1>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Curso</th><th>Fecha</th><th>Hora</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/estudiante.js"></script>
</body>
</html>
