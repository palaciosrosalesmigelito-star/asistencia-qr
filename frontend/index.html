<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Asistencia - Acceso</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Splash screen con mascota programadora -->
  <div class="splash" id="splash">
    <svg class="splash-mascot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g class="mascot-body">
        <ellipse cx="100" cy="150" rx="55" ry="30" fill="#6366f1" />
        <circle cx="100" cy="95" r="40" fill="#a5b4fc" />
        <rect x="70" y="85" width="60" height="8" rx="4" fill="#1e293b" />
        <circle cx="85" cy="90" r="4" fill="#fff" />
        <circle cx="115" cy="90" r="4" fill="#fff" />
        <rect x="60" y="135" width="80" height="45" rx="8" fill="#1e293b" />
        <rect x="70" y="145" width="60" height="25" rx="4" fill="#334155" />
        <g class="mascot-hand-left">
          <rect x="55" y="150" width="18" height="8" rx="4" fill="#a5b4fc" />
        </g>
        <g class="mascot-hand-right">
          <rect x="127" y="150" width="18" height="8" rx="4" fill="#a5b4fc" />
        </g>
      </g>
    </svg>
    <p class="splash-title">Preparando tu acceso...</p>
  </div>

  <!-- Transición entre pantallas -->
  <div class="transition-overlay" id="transitionOverlay">
    <svg class="runner-mascot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g>
        <ellipse cx="100" cy="150" rx="50" ry="28" fill="#f59e0b" />
        <circle cx="100" cy="95" r="38" fill="#fbbf24" />
        <circle cx="88" cy="90" r="5" fill="#1e293b" />
        <circle cx="112" cy="90" r="5" fill="#1e293b" />
        <ellipse cx="100" cy="105" rx="6" ry="4" fill="#1e293b" />
      </g>
    </svg>
  </div>

  <div class="container">
    <div class="card">
      <h1>Registro de Asistencia</h1>
      <p class="subtitle">Colegio / Instituto / Universidad</p>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" required placeholder="usuario@institucion.edu" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" />

        <label for="role">Rol</label>
        <select id="role" required>
          <option value="">Seleccione un rol</option>
          <option value="docente">Docente</option>
          <option value="estudiante">Estudiante</option>
        </select>

        <button type="submit">Ingresar</button>
      </form>
      <p id="msg" class="msg"></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
