<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Docente</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="topbar">
    <h2>Panel Docente</h2>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <a href="#" class="active" data-view="generar">Generar QR</a>
      <a href="#" data-view="sesiones">Mis sesiones</a>
      <a href="#" data-view="asistencia">Asistencia</a>
    </aside>
    <main class="content">
      <div id="view-generar">
        <h1>Generar código QR de asistencia</h1>
        <div class="tile">
          <label for="course">Curso / Asignatura</label>
          <input type="text" id="course" placeholder="Ej. Matemática I" />
          <label for="sessionDate">Fecha</label>
          <input type="date" id="sessionDate" />
          <button id="genBtn">Generar QR</button>
        </div>
        <div class="qr-module" id="qrResult" style="margin-top:1.25rem;">
          <div class="qr-frame">
            <span class="qr-corner tl"></span>
            <span class="qr-corner tr"></span>
            <span class="qr-corner bl"></span>
            <span class="qr-corner br"></span>
            <div id="qrcode"></div>
          </div>
          <p id="qrInfo" class="msg text-center mt-2"></p>
          <div class="qr-actions">
            <button class="floating secondary" id="downloadQrBtn">⬇ Descargar QR</button>
            <button class="floating secondary" id="fullscreenQrBtn">⛶ Proyectar</button>
          </div>
        </div>
      </div>

      <div id="view-sesiones" class="hidden">
        <h1>Mis sesiones</h1>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Curso</th><th>Fecha</th><th>Código</th><th>Asistencias</th></tr></thead>
          <tbody id="sessionsBody"></tbody>
        </table>
        </div>
      </div>

      <div id="view-asistencia" class="hidden">
        <h1>Registro de asistencia en tiempo real</h1>
        <p class="subtitle">Alumnos que han registrado su presencia</p>
        <div id="attList" class="live-list"></div>
        <div id="attEmpty" class="tile text-center" style="margin-top:1rem;">
          <p style="color:var(--muted);">Aún no hay asistencias registradas.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/docente.js"></script>
</body>
</html>
