<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Estudiante</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="topbar">
    <h2>Panel Estudiante</h2>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <a href="#" class="active" data-view="escanear">Escanear QR</a>
      <a href="#" data-view="historial">Mi asistencia</a>
    </aside>
    <main class="content">
      <div id="view-escanear">
        <h1>Registrar asistencia</h1>
        <div class="tile">
          <div class="scanner-frame" id="scannerFrame">
            <div id="reader"></div>
            <span class="scanner-corner tl"></span>
            <span class="scanner-corner tr"></span>
            <span class="scanner-corner bl"></span>
            <span class="scanner-corner br"></span>
            <div class="scan-line"></div>
          </div>
          <p id="scanMsg" class="msg text-center mt-2"></p>
          <button id="startScanBtn" class="success large mt-2">Activar cámara y escanear</button>
        </div>
      </div>
      <div id="view-historial" class="hidden">
        <h1>Mi historial de asistencia</h1>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Curso</th><th>Fecha</th><th>Hora</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/estudiante.js"></script>
</body>
</html>
